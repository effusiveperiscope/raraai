exp_name: test01
data:
  filter_length: 1536
  hop_length: 480
  max_wav_value: 32768.0
  mel_channels: 100
  mel_fmax: 24000.0
  mel_fmin: 50.0
  sampling_rate: 48000
  segment_size: 8000
  training_files: files/train.txt
  validation_files: files/valid.txt
  win_length: 1536
dist_config:
  dist_backend: nccl
  dist_url: tcp://localhost:54321
  world_size: 1
gen:
  resblock: '1'
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  resblock_kernel_sizes: [3, 7, 11]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [24, 20, 4, 4]
  upsample_rates: [12, 10, 2, 2]
  upsample_input: 192
log:
  log_dir: logs
  num_audio: 6
  pth_dir: chkpt
mpd:
  kernel_size: 5
  lReLU_slope: 0.2
  periods: [2, 3, 5, 7, 11]
  stride: 3
  use_spectral_norm: false
mrd:
  lReLU_slope: 0.2
  resolutions: '[(1024, 120, 600), (2048, 240, 1200), (4096, 480, 2400), (512, 50,
    240)]'
  use_spectral_norm: false
train:
  batch_size: 16

  weight_decay: 1e-4
  cosine_anneal_end: 500000
  betas:
  - 0.8
  - 0.99

  c_kl: 0.2
  c_mel: 1.0
  c_stft: 9
  epochs: 602
  eps: 1e-9
  lr: 5e-5
  lr_decay: 0.999875
  grad_clip_thresh: 10000.
  model: sovits
  port: 8001
  pretrain: ./vits_pretrain/sovits5.0_bigvgan_mix_v2.pth
  seed: 1234

  train_filelist: ./data/expresso/train.txt
  val_filelist: ./data/expresso/val.txt
  test_filelist: ./data/test/train.txt
  test_interval: 1
  val_interval: 1
  save_interval: 10
  keep_ckpts: 2

  stage2_epoch: 20
vits:
  filter_channels: 640
  gin_channels: 256
  hidden_channels: 192
  inter_channels: 192
  ppg_dim: 1280
  spk_dim: 256
  vec_dim: 256
