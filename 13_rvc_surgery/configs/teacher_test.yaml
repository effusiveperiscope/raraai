exp_name: teacher_test
train:
  filelist: data/teacher_base10/train.txt
  val_filelist: data/teacher_base10/val.txt
  lam_recon: 1.0
  lam_spk: 0.5

  lr: 1e-4
  batch_size: 8
  weight_decay: 1e-4

  noise_scale: 0.6
  max_epochs: 10000

data:
  num_workers: 4

model:
  segment_size: 32
  vevo_dim: 1024
  hubert_dim: 512 # whisper-base
  inter_channels: 192
  disc_channels: 256
  content_size: 64
  spec_channels: 1025
  hidden_channels: 192
  filter_channels: 768
  n_heads: 2
  n_layers: 6
  kernel_size: 3
  p_dropout: 0
  resblock: '1'
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  upsample_rates: [12, 10, 2, 2]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [24, 20, 4, 4]
  spk_embed_dim: 10 # Probably more than this cannot be represented (??)
  gin_channels: 256
  sr: 48000