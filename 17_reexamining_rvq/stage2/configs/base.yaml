# test01 - base
# test02 - add speaker conditioning to prior
# test03 - from base instead of from test01
# test04 - use speaker ids instead of embeddings
# test05 - transfer from test04, 
# use linear hybrid pitch conditioning for both F0 predictor and prior, 
# warmup for new prior, reduce f0 lr, increase kl lr for warmup
# test06 - from base instead of from test04
# test06_ac - use acoustic subset and only tune decoder
# test06_ac_01 - use acoustic subset, full finetuning
# test07 - use 48 codebook instead of 32. reduce batch size to 7 because we keep hitting out of memory
# test07_ac - use expresso only, full finetuning
# test08_ac - switch to RVC discriminator
# test09_ac - remove vctk from dataset and do finetuning on full acoustic subset
exp_name: test09_ac
tensorboard_version: 1
codec:
  whisper_dim: 512
  codebook_size: 48
data:
  filter_length: 1536
  hop_length: 480
  max_wav_value: 32768.0
  mel_channels: 100
  mel_fmax: 24000.0 
  mel_fmin: 50.0
  sampling_rate: 48000
  segment_size: 8000
  win_length: 1536
dist_config:
  dist_backend: nccl
  dist_url: tcp://localhost:54321
  world_size: 1
gen:
  resblock: '1'
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  resblock_kernel_sizes: [3, 7, 11]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [24, 20, 4, 4]
  upsample_rates: [12, 10, 2, 2]
  upsample_input: 192
log:
  log_dir: logs
  num_audio: 6
  pth_dir: chkpt
mpd:
  kernel_size: 5
  lReLU_slope: 0.2
  periods: [2, 3, 5, 7, 11]
  stride: 3
  use_spectral_norm: false
mrd:
  lReLU_slope: 0.2
  resolutions: '[(1024, 120, 600), (2048, 240, 1200), (4096, 480, 2400), (512, 50,
    240)]'
  use_spectral_norm: false
train:
  batch_size: 7

  weight_decay: 1e-4
  cosine_anneal_steps: 500000
  warmup_steps: 10000
  # test05_warmup: 10000
  betas:
  - 0.8
  - 0.99

  c_kl: 0.2
  c_mel: 1.0
  c_stft: 9
  c_f0: 0.01
  epochs: 602
  eps: 1e-9
  lr: 1e-4
  lr_decay: 0.999875
  grad_clip_thresh: 10000.
  model: sovits
  port: 8001
  seed: 1234
  max_steps: -1

  train_filelist: ./data/full/train_novctk.txt
  val_filelist: ./data/full/val_novctk.txt
  spk_index: ./data/full/sid_avgs.pt
  test_filelist: ./data/test/val.txt
  test_noise_scale: 0.34
  test_interval: 1
  test_transpose: 12
  test_sid: 6
  val_interval: 1
  keep_ckpts: 2

  stage2_epoch: 0 # start training using gen/disc losses
vits:
  filter_channels: 640
  gin_channels: 256
  hidden_channels: 192
  inter_channels: 192
  ppg_dim: 1280
  spk_dim: 256
  max_spk_count: 256
  vec_dim: 256
  use_pitch_predictor: true
  pitch_quant_dim: 10