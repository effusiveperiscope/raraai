exp_name: acoustic_anchor
data:
  filter_length: 1536
  hop_length: 480
  max_wav_value: 32768.0
  mel_channels: 100
  mel_fmax: 24000.0
  mel_fmin: 50.0
  sampling_rate: 48000
  segment_size: 7680
  win_length: 1536
dist_config:
  dist_backend: nccl
  dist_url: tcp://localhost:54321
  world_size: 1
gen:
  resblock_dilation_sizes:
  - - 1
    - 3
    - 5
  - - 1
    - 3
    - 5
  - - 1
    - 3
    - 5
  resblock_kernel_sizes:
  - 3
  - 7
  - 11
  upsample_initial_channel: 320
  upsample_input: 192
  upsample_kernel_sizes:
  - 15
  - 8
  - 8
  - 5
  - 4
  upsample_rates:
  - 5
  - 4
  - 4
  - 3
  - 2
mpd:
  kernel_size: 5
  lReLU_slope: 0.2
  periods:
  - 2
  - 3
  - 5
  - 7
  - 11
  stride: 3
  use_spectral_norm: false
mrd:
  lReLU_slope: 0.2
  resolutions: '[(1024, 120, 600), (2048, 240, 1200), (4096, 480, 2400), (512, 50,
    240)]'
  use_spectral_norm: false
train:
  batch_size: 8
  betas:
  - 0.8
  - 0.99
  c_kl: 0.2
  c_mel: 1.0
  c_stft: 9
  c_anchor: 0.2
  epochs: 602
  eps: 1e-7
  lr: 5e-5
  lr_decay: 0.999875
  disc_lr_factor: 0.5
  model: sovits
  port: 8001
  seed: 1234

  save_interval: null
  val_interval: 1
  test_interval: 1
  keep_ckpts: 2
  log_dir: logs
  train_filelist: data/titan/train.txt
  val_filelist: data/titan/val.txt
  test_filelist: data/test/val.txt
  anchor_filelist: data/anchor_sing_tiny/train.txt
  spk_index: data/titan/sid_avgs.pt
  max_steps: 300000000

  test_sid: 0
  test_transpose: 12

  anchor_step_interval: 2
  stage2_steps: 150000

vits:
  filter_channels: 640
  gin_channels: 256
  hidden_channels: 192
  inter_channels: 192
  ppg_dim: 1280
  spk_dim: 256
  vec_dim: 512
