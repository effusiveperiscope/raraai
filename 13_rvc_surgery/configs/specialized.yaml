exp_name: specialized
train:
  lr: 1e-6
  batch_size: 6
  filelist: data/specialized/train.txt
  val_filelist: data/specialized/val.txt
  epochs: 100
model:
  spec_channels: 1025
  segment_size: 32
  inter_channels: 192
  hidden_channels: 192
  filter_channels: 768
  n_heads: 2
  n_layers: 6
  kernel_size: 3
  p_dropout: 0
  resblock: '1'
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  upsample_rates: [12, 10, 2, 2]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [24, 20, 4, 4]
  spk_embed_dim: 109
  gin_channels: 256
  sr: 48000