# rarity - base
# rarity_01 - freeze decoder
# rarity_02 - new base
# rarity_02_f0_test - reset f0 weights and try pitch prediction again
exp_name: rarity_02_f0
tensorboard_version: 0
codec:
  whisper_dim: 512
  codebook_size: 48
data:
  filter_length: 1536
  hop_length: 480
  max_wav_value: 32768.0
  mel_channels: 100
  mel_fmax: 24000.0 
  mel_fmin: 50.0
  sampling_rate: 48000
  segment_size: 8000
  win_length: 1536
dist_config:
  dist_backend: nccl
  dist_url: tcp://localhost:54321
  world_size: 1
gen:
  resblock: '1'
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  resblock_kernel_sizes: [3, 7, 11]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [24, 20, 4, 4]
  upsample_rates: [12, 10, 2, 2]
  upsample_input: 192
log:
  log_dir: logs
  num_audio: 6
  pth_dir: chkpt
mpd:
  kernel_size: 5
  lReLU_slope: 0.2
  periods: [2, 3, 5, 7, 11]
  stride: 3
  use_spectral_norm: false
mrd:
  lReLU_slope: 0.2
  resolutions: '[(1024, 120, 600), (2048, 240, 1200), (4096, 480, 2400), (512, 50,
    240)]'
  use_spectral_norm: false
train:
  batch_size: 8

  weight_decay: 1e-4
  cosine_anneal_steps: 500000
  warmup_steps: 10000
  freeze_dec: true
  # test05_warmup: 10000
  betas:
  - 0.8
  - 0.99

  c_kl: 0.2
  c_mel: 1.0
  c_stft: 9
  epochs: -1
  eps: 1e-9
  lr: 1e-4
  lr_decay: 0.999875
  grad_clip_thresh: 10000.
  model: sovits
  port: 8001
  seed: 1234
  max_steps: 200000

  train_filelist: ./data/raritys1-s3/train.txt
  val_filelist: ./data/raritys1-s3/val.txt
  spk_index: ./data/raritys1-s3/sid_avgs.pt
  test_filelist: ./data/test/val.txt
  test_noise_scale: 0.34
  test_interval: 5
  test_transpose: 12
  val_interval: 5

  f0_gen_interval: 3
  c_f0: 0.5
  c_f0_adv: 0.5
  train_f0_only: False
  reset_f0_weights: False
  p_pit_extra: 0.5

  save_interval: null
  keep_ckpts: 2

  stage2_epoch: 0 # start training using gen/disc losses
  num_workers: 4
vits:
  filter_channels: 640
  gin_channels: 256
  hidden_channels: 192
  inter_channels: 192
  ppg_dim: 1280
  spk_dim: 256
  max_spk_count: 256
  vec_dim: 256
  use_pitch_predictor: true
  pitch_quant_dim: 10