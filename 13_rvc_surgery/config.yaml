exp_name: condensed
train:
  lr: 1e-5
  lr_stage2: 1e-5
  batch_size: 4
  filelist: data/condensed/train.txt
  val_filelist: data/condensed/val.txt
  epochs: 100
  lam_mel: 45
  lam_kl: 1.0
model:
  spec_channels: 1025
  segment_size: 32
  inter_channels: 192
  hidden_channels: 192
  filter_channels: 768
  n_heads: 2
  n_layers: 6
  kernel_size: 3
  p_dropout: 0
  resblock: '1'
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  upsample_rates: [12, 10, 2, 2]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [24, 20, 4, 4]
  spk_embed_dim: 109
  gin_channels: 256
  sr: 48000
data:
  hop_length: 480
  segment_size: 17280
  n_fft: 2048
  num_mels: 128
  sampling_rate: 48000
  win_size: 2048
  fmin: 0
  fmax: null