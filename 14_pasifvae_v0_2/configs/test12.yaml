train:
  exp_name: test12_v0_2
  filelist: data/test/filelist.txt
  batch_size: 8
  seed: 42
  val_frac: 0.05
  num_workers: 4
  epochs: 1000
  
  learning_rate: 2e-5
  warmup_steps: 4000
  max_steps: 100000
  gradient_clip_norm: 1.0

  label_smoothing: 0.1
  
  # Loss weights (start with these, then schedule)
  reconstruction_weight: 0.8
  phoneme_loss_weight: 0.6

  speaker_adversarial_start: 14000 # no point in running until sane outputs are produced
  # give some time to warm up before adding GRL
  speaker_adversarial_weight: 0.1

  orthogonality_weight: 0.1
  
  # VAE scheduling
  kl_annealing_start: 20000
  kl_annealing_end: 80000  # Gradually increase KL weight
  kl_loss_weight_init: 0.0  # Start low, increase gradually
  kl_loss_weight_max: 0.1
  
  # Speaker adversarial scheduling
  grl_lambda_start: 0.0
  grl_lambda_max: 0.2
  grl_schedule_start: 20000
  grl_schedule_end: 50000
model:
  whisper_dim: 512   # Whisper base feature dim
  n_phonemes: 40     # Standard phoneme set size
  n_speakers: 38     # Adjust based on your dataset
  latent_dim: 64     # Small bottleneck to prevent speaker leakage
  d_spk: 32 # speaker embedding dim
  pitch_cond: False
  
  # Special tokens
  bos_token_id: 40
  pad_token_id: 41
  eos_token_id: 42

  d_encoder: 192

  phoneme_decoder:
    num_heads: 8
    d_ff: 2048
    dropout: 0.4
    num_layers: 5

  prior_encoder:
    num_heads: 8
    d_ff: 2048
    dropout: 0.1
    num_layers: 4 

  decoder:
    d_model: 192
    num_heads: 8
    d_ff: 2048
    dropout: 0.1
    in_layers: 2
    spk_layers: 3
    pitch_layers: 5

  spk_classifier:
    d_model: 192  
    num_heads: 4
    d_ff: 1024
    conv_kernel_size: 5
    dropout: 0.2 
    num_layers: 8
    min_segment_len: 5
    max_segment_len: 20
