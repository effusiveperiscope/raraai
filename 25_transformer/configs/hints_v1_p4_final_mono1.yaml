exp_name: hints_v1_p4_final_mono1_cont # overnight exp. 
# - continuing training for longer than val ce suggests is appropriate... just to see if anything improves
tensorboard_version: 0
transformer:
  hidden_size: 768
  n_heads: 12
  encoder_layers: 6
  decoder_layers: 12
  dim_feedforward: 2048
  dropout: 0.05
  max_positions: 4096
  phone_vocab_size: 1024
  phone_pad_id: 0
  n_speakers: 4096
  hints: true
  hints_json: data/genshin_plus_extras/hints_rel.json
  relative_register: true
  decoder_hints: true
  semantic_dim: 384
  hint_pitch_edges:
  - -6.0
  - -4.0
  - -2.0
  - 0.0
  - 2.0
  - 4.0
  - 6.0
  n_slot_buckets: 8
  hint_dropout:
    intensity: 0.15
    register: 0.1
    pitch: 0.15
    semantic: 0.2
    timing: 0.15
  hint_null_all: 0.1
  hint_film_memory: false
  hint_decoder_proj: false
  hint_monotone: true
  hint_guidance: null
  hint_guidance_books: null
  decoder_speaker_cond: true
  memory_norm: temporal
  residual_scale: true
  eos_token: true
  fim: true
  region_cond: true
  length_cond: true
  n_len_buckets: 9
  fim_min_frames: 8
  fim_mid_frac: 0.5
  codebook_weights:
  - 1.0
  - 0.9
  - 0.8
  - 0.7
  - 0.6
  - 0.5
  - 0.4
  - 0.4
  - 0.7
  - 0.5
  codebook_weight_warmup_epochs: 5
codec:
  code_dim: 1024
  codebook_size: 64
  codebook_num: 8
  ema_decay: 0.99
pitch_codec:
  hidden_channels: 64
  code_dim: 128
  codebook_size: 128
  codebook_num: 2
  ema_decay: 0.99
  downsample_kernel: 8
  upsample_kernel: 16
data:
  filter_length: 1536
  max_wav_value: 32768.0
  mel_channels: 100
  mel_fmax: 24000.0
  mel_fmin: 50.0
  sampling_rate: 48000
  segment_size: 8000
  win_length: 1536
  hop_length: 480
  audio_norm:
    mode: peak
    target_db: -1.0
    max_gain_db: 30.0
    frame_ms: 20.0
vits:
  filter_channels: 640
  gin_channels: 256
  hidden_channels: 192
  inter_channels: 192
  ppg_dim: 1280
  spk_dim: 256
  max_spk_count: 16384
  vec_dim: 256
gen:
  resblock: '1'
  resblock_dilation_sizes:
  - - 1
    - 3
    - 5
  - - 1
    - 3
    - 5
  - - 1
    - 3
    - 5
  resblock_kernel_sizes:
  - 3
  - 7
  - 11
  upsample_initial_channel: 512
  upsample_kernel_sizes:
  - 24
  - 20
  - 4
  - 4
  upsample_rates:
  - 12
  - 10
  - 2
  - 2
  upsample_input: 192
train:
  batch_size: 24
  lr: 5.0e-05
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-08
  weight_decay: 0.01
  muon_lr_mult: 200.0
  muon_ns_steps: 3
  muon_include_embeddings: false
  muon_include_heads: false
  compile_decoder: false
  precision: 32-true
  grad_clip_val: 1.0
  grad_clip_algorithm: norm
  cosine_anneal_end: 500000
  max_steps: 500000
  max_epochs: -1
  max_frames: 256
  max_phone_length: 512
  fim_rate: 0.2
  fim_probe_batches: 2
  val_interval: 1
  log_interval: 50
  keep_ckpts: 2
  log_dir: logs_stage2
  num_workers: 6
  train_filelist: data/genshin_plus_extras/train_stage2.txt
  val_filelist: data/genshin_plus_extras/val_stage2.txt
  speaker_map: null
  generator_checkpoint: checkpoints_stage1/base_v0.7/last.ckpt
  pitch_uv_threshold: 0.5
  text_delta_batches: 4
  hint_probe_batches: 2
  hint_channel_probe: 1
  sample_hint_guidance: null
  counterfactual_margin: 0.05
  counterfactual_weight: 0.2
  counterfactual_rate: 0.25
  counterfactual_channels: intensity,register
  sample_hints: cond
  sample_interval: 1
  sample_count: 2
  sample_frames: 128
  sample_temperature: 0.9
  sample_top_k: 20
  speaker_probe: 2
  ood_samples: 1
  ood_frames: 512
  ood_texts: null
  ood_sid: 612
  limit_train_batches: 8000
