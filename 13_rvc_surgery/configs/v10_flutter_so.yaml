# Two sources of regularization:
# 1. Increase GRL dramatically as a form of regularization for KL
# 2. Freeze decoder layers to avoid acoustic info degradation
# Also increase LR
# 8 - increase GRL even more
# 9 - freeze decoder, don't use strategy1, reduce lam_kl to 0.5 because it keeps overfitting
# 10 - reduce content inv (will overfit on small dataset), raise lam_kl back to original, reduce lam_grl to 0.6
# 11 - use strategy1, re-increase grl to 1.0
exp_name: v10_flutter_so11
train:
  lr: 1e-4
  batch_size: 12
  filelist: data/fluttershy_sing_only/train.txt
  val_filelist: data/fluttershy_sing_only/val.txt
  test_filelist: data/test_whisper/val.txt
  octave_transpose_test: True
  sid_test: 0
  noise_scale_test: 0.5
  epochs: 2001
  val_every_n_epochs: 5
  test_every_n_epochs: 50
  save_every_n_epochs: 100
  lam_mel: 45
  lam_kl: 1.0
  lam_kl_reg_logs: 0.3
  lam_kl_reg_mus: 0.03

  lam_grl: 1.0
  grl_end: 0
  grl_every: 1
  freeze_prior: False
  freeze_decoder: False 
  strategy1: True

  lam_content_inv: 1.0
  phone_aug_max: 2.0
  spec_aug_scale: 0.2
  spec_am_min: 0.7
  spec_am_max: 1.3
  spec_am_points: 100
  label_alpha: 0.05 # GAN label smoothing
  disc_noise_scale: 0.0003
  stage1_train_step: 4000
  cosine_anneal_end: 20000
  weight_decay: 1e-3
  max_use_id: 11 # inclusive

model:
  segment_size: 32
  vevo_dim: 1024
  hubert_dim: 768 # whisper-small
  inter_channels: 192
  disc_channels: 384

  spec_channels: 1025
  hidden_channels: 192
  filter_channels: 768
  n_heads: 2
  n_layers: 6
  kernel_size: 3
  p_dropout: 0
  resblock: '1'
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  upsample_rates: [12, 10, 2, 2]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [24, 20, 4, 4]
  spk_embed_dim: 200 
  spk_emb_channels: 256 # SVC5 speaker invariance embedding from mozilla TTS
  gin_channels: 256
  sr: 48000
data:
  hop_length: 480
  segment_size: 17280
  max_len: 480000
  n_fft: 2048
  num_mels: 128
  sampling_rate: 48000
  win_size: 2048
  fmin: 0
  fmax: null
  num_workers: 4