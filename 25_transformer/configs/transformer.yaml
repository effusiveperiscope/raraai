# Stage-2 transformer: phonemes + speaker -> spec/pitch RVQ codes.
#
# Trains modeling/transformer.py ("CodeTransformer") on the codec codes
# produced by 2_preprocess.py, using a MusicGen-style delay pattern across
# the spec (codec) and pitch (pitch_codec) codebooks.
#
# Expected filelists (written by 2_preprocess):
#   data/base/train_stage2.txt
#   data/base/val_stage2.txt
exp_name: transformer_v0.1
tensorboard_version: 0

# ---------------------------------------------------------------- model ---
transformer:
  hidden_size: 768
  n_heads: 12
  encoder_layers: 4
  decoder_layers: 10
  dim_feedforward: 2048
  dropout: 0.1
  max_positions: 4096
  phone_vocab_size: 1024   # g2pen_tokenizer_clean vocab
  phone_pad_id: 0
  n_speakers: 512

# The codebook layout below must match the stage-1 Generator that produced
# the codes (see configs/base.yaml).
codec:
  code_dim: 1024
  codebook_size: 64
  codebook_num: 8
pitch_codec:
  hidden_channels: 32
  code_dim: 32
  codebook_size: 32
  codebook_num: 2

# --------------------------------------------------------------- data ----
data:
  filter_length: 1536
  max_wav_value: 32768.0
  mel_channels: 100
  mel_fmax: 24000.0
  mel_fmin: 50.0
  sampling_rate: 48000
  segment_size: 8000
  win_length: 1536
  hop_length: 480

# -------------------------------------------------------- stage-1 model ---
# Only needed for the (optional) audio sampling during validation: the
# transformer samples codes, then Generator.infer_from_codes re-synthesises
# audio so it can be logged to TensorBoard.
vits:
  filter_channels: 640
  gin_channels: 256
  hidden_channels: 192
  inter_channels: 192
  ppg_dim: 1280
  spk_dim: 256
  max_spk_count: 16384
  vec_dim: 256
gen:
  resblock: '1'
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  resblock_kernel_sizes: [3, 7, 11]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [24, 20, 4, 4]
  upsample_rates: [12, 10, 2, 2]
  upsample_input: 192

# -------------------------------------------------------------- train ----
train:
  batch_size: 8
  lr: 1e-4
  betas:
  - 0.9
  - 0.98
  eps: 1e-8
  weight_decay: 0.01
  cosine_anneal_end: 1000000
  max_steps: 1000000
  max_epochs: -1
  max_frames: 256          # code frames per training segment (25 Hz)
  max_phone_length: 512
  val_interval: 1
  log_interval: 50
  keep_ckpts: 2
  log_dir: logs
  train_filelist: data/test2/train_stage2.txt
  val_filelist: data/test2/val_stage2.txt
  # Optional: stage-1 Generator checkpoint used to turn sampled codes into
  # audio for TensorBoard. Set to null to disable audio logging.
  generator_checkpoint: checkpoints/base_v0.4/last.ckpt
  sample_interval: 1
  sample_count: 2
  sample_frames: 128
