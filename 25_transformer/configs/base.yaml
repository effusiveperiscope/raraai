# 0.1 - multiple codebooks, 1024 code dim, 512 codebook size, from scratch
# 0.2 - spk cond in codebook decoder, switch code params to DAC-esque
# 0.3 - remove perplexity opt
# 0.4 - add pitch codes
# 0.4.1 - pitch codes increase capacity
# 0.4.2 - pitch discriminator
# 0.4.2a - pitch only
# 0.4.3 - increase capacity, reset
# 0.4.3a - increase discriminator capacity
# 0.4.4 - slope-aware patch pitch critic, overlapping pitch upsample, fp32 pitch path
exp_name: base_v0.4.4
vits:
  filter_channels: 640
  gin_channels: 256
  hidden_channels: 192
  inter_channels: 192
  ppg_dim: 1280
  spk_dim: 256
  max_spk_count: 16384
  vec_dim: 256
data:
  filter_length: 1536
  max_wav_value: 32768.0
  mel_channels: 100
  mel_fmax: 24000.0 
  mel_fmin: 50.0
  sampling_rate: 48000
  segment_size: 8000
  win_length: 1536
  hop_length: 480
codec:
  code_dim: 1024
  codebook_size: 64
  codebook_num: 8
pitch_codec:
  hidden_channels: 64
  code_dim: 64
  codebook_size: 64
  codebook_num: 2
  upsample_kernel: 16
# Slope-aware patch critic for the pitch contour (see modeling/pitch_discriminator.py).
# ~52k params per branch at channels=32, so ~160k for n_scales=3.
pitch_discriminator:
  channels: 64
  n_scales: 3
  kernel_size: 5
  # Gain on the (log-f0 first difference) input channel; log-f0 is ~[0, 1]
  # while per-frame slopes are ~1e-3.
  delta_scale: 50.0
mpd:
  kernel_size: 5
  lReLU_slope: 0.2
  periods:
  - 2
  - 3
  - 5
  - 7
  - 11
  stride: 3
  use_spectral_norm: false
mrd:
  lReLU_slope: 0.2
  resolutions: '[(1024, 120, 600), (2048, 240, 1200), (4096, 480, 2400), (512, 50,
    240)]'
  use_spectral_norm: false
gen:
  resblock: '1'
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  resblock_kernel_sizes: [3, 7, 11]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [24, 20, 4, 4]
  upsample_rates: [12, 10, 2, 2]
  upsample_input: 192
train:
  batch_size: 8
  betas:
  - 0.8
  - 0.99
  c_mel: 1.0
  c_stft: 9
  c_pitch_dec: 1.0
  c_pitch_q: 0.5
  c_pitch_adv: 1.0
  c_pitch_feat: 1.0
  c_pitch_uv: 1.0
  c_pitch_uv_frame: 0.1
  pitch_uv_threshold: 0.5
  eps: 1e-7
  lr: 1e-4
  val_interval: 1
  test_interval: 1
  keep_ckpts: 2
  log_dir: logs
  train_filelist: data/base/train.txt
  val_filelist: data/base/val.txt
  max_steps: 3e7
