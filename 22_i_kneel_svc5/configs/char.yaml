exp_name: applejack_sing9
data:
  filter_length: 1536
  hop_length: 480
  max_wav_value: 32768.0
  mel_channels: 100
  mel_fmax: 24000.0
  mel_fmin: 50.0
  sampling_rate: 48000
  segment_size: 7680
  win_length: 1536
dist_config:
  dist_backend: nccl
  dist_url: tcp://localhost:54321
  world_size: 1
gen:
  resblock: '1'
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  resblock_kernel_sizes: [3, 7, 11]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [24, 20, 4, 4]
  upsample_rates: [12, 10, 2, 2]
  upsample_input: 192
mpd:
  kernel_size: 5
  lReLU_slope: 0.2
  periods:
  - 2
  - 3
  - 5
  - 7
  - 11
  stride: 3
  use_spectral_norm: false
mrd:
  lReLU_slope: 0.2
  resolutions: '[(1024, 120, 600), (2048, 240, 1200), (4096, 480, 2400), (512, 50,
    240)]'
  use_spectral_norm: false
train:
  batch_size: 8
  betas:
  - 0.8
  - 0.99
  c_kl: 0.2
  c_mel: 1.0
  c_stft: 9
  c_anchor: 0.3
  epochs: 602
  eps: 1e-7
  lr: 1e-4
  lr_decay: 0.999875
  model: sovits
  port: 8001
  seed: 1234

  save_interval: null
  val_interval: 1
  test_interval: 1
  keep_ckpts: 2
  log_dir: logs
  train_filelist: data/base/train.txt
  val_filelist: data/base/val.txt
  test_filelist: data/test/val.txt
  spk_index: data/base/sid_avgs.pt

  test_sid: 0
  test_transpose: 12

  enc_p_freeze_n: 0

  max_steps: 3e7

vits:
  filter_channels: 640
  gin_channels: 256
  hidden_channels: 192
  inter_channels: 192
  ppg_dim: 1280
  spk_dim: 256
  vec_dim: 256
